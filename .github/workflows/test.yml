name: protocol link length
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results.md
